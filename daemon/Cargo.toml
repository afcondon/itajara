[package]
name = "itajara"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Itajara \u2014 the looper engine (Epinephelus itajara, the goliath grouper, which booms): CoreAudio capture/playback, layered loops, and the latency metrology the layering depends on"

[dependencies]
cpal = "0.15"
# Already in the tree under cpal; named here because the daemon asks CoreAudio
# directly for one thing cpal does not expose — what an aggregate device is
# made of, and in what order. See `src/aggregate.rs` for why that is not
# optional on a rig with more than one interface.
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"
tungstenite = "0.24"
# `clock_gettime(CLOCK_UPTIME_RAW)`, the host clock CoreAudio stamps buffers
# with, read in the Link listener to date an anchor on the audio's own clock.
# Already in the tree under cpal.
libc = "0.2"
# For the two messages sent TO link-spike (`/link/set-tempo`, `/link/play`),
# and in the tests to build an anchor the way link-spike used to.
rosc = "0.10"
# /link/anchor: the value, its validity rule and its 56 bytes, shared with
# link-spike and es9-daemon and held to Binnacle's conformance vectors
# (binnacle/conformance/LINK-ANCHOR.md). Taken from git at a pinned commit so
# that this repository builds from a lone clone; Cargo finds the crate inside
# the Binnacle repository by its package name.
link-anchor = { git = "https://github.com/afcondon/binnacle", rev = "2eeec3cfac3d05e186aa265f36188afb97012f57" }
# `SmallRng` for chance, which rolls once per loop per cycle in the audio
# callback. Already in the tree — tungstenite pulls it for WebSocket masking
# keys — so this is a feature flag rather than a dependency, and a studied
# generator rather than a hand-rolled one. The rule it obeys is the ordinary
# audio rule: own the state, seed it off the callback. `thread_rng()` is the
# one that must never appear here, since it reseeds from the OS as it goes.
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
# For `engine/conformance.rs` only: reading the Glassbox conformance vectors
# (`purescript-glassbox/conformance/vectors/itajara-loop.json`) the phase
# machine is replayed against. The daemon itself parses no JSON.
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
