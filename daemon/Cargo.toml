[package]
name = "itajara"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Itajara \u2014 the looper engine (Epinephelus itajara, the goliath grouper, which booms): CoreAudio capture/playback, layered loops, and the latency metrology the layering depends on"

[dependencies]
cpal = "0.15"
tungstenite = "0.24"
# For /link/anchor only. Hand-decoding was the obvious move given the WAV header
# next door, but OSC has padding rules and — unlike a WAV — there is no
# independent decoder to check a hand-rolled parse against. link-spike encodes
# these bytes with this crate and es9-daemon decodes them with it, so matching
# it means a parse bug cannot be a divergence from the thing generating them.
rosc = "0.10"
# `SmallRng` for chance, which rolls once per loop per cycle in the audio
# callback. Already in the tree — tungstenite pulls it for WebSocket masking
# keys — so this is a feature flag rather than a dependency, and a studied
# generator rather than a hand-rolled one. The rule it obeys is the ordinary
# audio rule: own the state, seed it off the callback. `thread_rng()` is the
# one that must never appear here, since it reseeds from the OS as it goes.
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
# For `engine/conformance.rs` only: reading the Glassbox conformance vectors
# (`purescript-glassbox/conformance/vectors/itajara-loop.json`) the phase
# machine is replayed against. The daemon itself parses no JSON.
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
